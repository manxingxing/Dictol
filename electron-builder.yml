appId: com.dictol.app
productName: Dictol
protocols:
  - name: Dictol
    schemes:
      - dictol
directories:
  buildResources: build
files:
  - out/**
  - drizzle/**
  - resources/**
  - '!resources/ecdict/**'
  - '!resources/sqlite-simple/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!Dictionaries/**'
  - '!dictionaries/**'
  - '!benchmarks/**'
  - '!docs/**'
  - '!native/**'
  - '!scripts/**'
  - '!node_modules/@dictol/mdict-native/{src,target,test,node_modules}/**'
  - '!node_modules/@dictol/mdict-native/{Cargo.lock,Cargo.toml,README.md,build.rs,index.d.ts,package-lock.json}'
  - '!node_modules/@dictol/accessibility-native/{macos,windows,target,test,node_modules}/**'
  - '!node_modules/@dictol/screen-capture-native/{macos,windows,target,test,node_modules}/**'
  - '!node_modules/@dictol/ocr-native/{macos,windows,target,test,node_modules}/**'
  - '!node_modules/adblock-rs/Cargo.lock'
  - '!node_modules/adblock-rs/Cargo.toml'
  - '!node_modules/adblock-rs/CHANGELOG.md'
  - '!node_modules/adblock-rs/README.md'
  - '!node_modules/adblock-rs/SECURITY.md'
  - '!node_modules/adblock-rs/benches/**'
  - '!node_modules/adblock-rs/fuzz/**'
  - '!node_modules/adblock-rs/src/**'
  - '!node_modules/adblock-rs/target/**'
  - '!node_modules/adblock-rs/rust-toolchain.toml'
  - '!node_modules/adblock-rs/rustfmt.toml'
  - '!node_modules/adblock-rs/js/artifacts.json'
  - '!node_modules/adblock-rs/js/Cargo.toml'
  - '!node_modules/adblock-rs/js/example.mjs'
  - '!node_modules/adblock-rs/js/src/**'
  - '!node_modules/adblock-rs/js/test/**'
asarUnpack:
  - resources/**
  - node_modules/@dictol/mdict-native/*.node
  - node_modules/@dictol/accessibility-native/prebuilds/**/*.node
  - node_modules/@dictol/screen-capture-native/prebuilds/**/*.node
  - node_modules/@dictol/ocr-native/prebuilds/**/*.node
  - node_modules/adblock-rs/js/index.node
  - node_modules/selection-hook/prebuilds/**
  - node_modules/better-sqlite3/lib/**
  - node_modules/better-sqlite3/prebuilds/*.node
  - node_modules/better-sqlite3/package.json
extraResources:
  - from: resources/ecdict
    to: ecdict
  - from: resources/sqlite-simple
    to: sqlite-simple
win:
  executableName: dictol
  icon: build/icon.ico
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  files:
    # Keep the Windows package self-contained while excluding unrelated
    # source, dictionary, and native-driver variants.
    - out/**
    - '!out/main/chunks/mac-*.js'
    - drizzle/**
    - resources/**
    - '!resources/system-translation/**'
    - '!resources/ecdict/**'
    - '!resources/sqlite-simple/**'
    - '!**/.vscode/*'
    - '!src/*'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
    - '!Dictionaries/**'
    - '!dictionaries/**'
    - '!benchmarks/**'
    - '!docs/**'
    - '!native/**'
    - '!scripts/**'
    - '!node_modules/@dictol/mdict-native/{src,target,test,node_modules}/**'
    - '!node_modules/@dictol/mdict-native/{Cargo.lock,Cargo.toml,README.md,build.rs,index.d.ts,package-lock.json}'
    - '!node_modules/@dictol/accessibility-native/{macos,windows,target,test,node_modules}/**'
    - '!node_modules/@dictol/screen-capture-native/{macos,windows,target,test,node_modules}/**'
    - '!node_modules/@dictol/ocr-native/{macos,windows,target,test,node_modules}/**'
    - '!node_modules/adblock-rs/Cargo.lock'
    - '!node_modules/adblock-rs/Cargo.toml'
    - '!node_modules/adblock-rs/CHANGELOG.md'
    - '!node_modules/adblock-rs/README.md'
    - '!node_modules/adblock-rs/SECURITY.md'
    - '!node_modules/adblock-rs/benches/**'
    - '!node_modules/adblock-rs/fuzz/**'
    - '!node_modules/adblock-rs/src/**'
    - '!node_modules/adblock-rs/target/**'
    - '!node_modules/adblock-rs/rust-toolchain.toml'
    - '!node_modules/adblock-rs/rustfmt.toml'
    - '!node_modules/adblock-rs/js/artifacts.json'
    - '!node_modules/adblock-rs/js/Cargo.toml'
    - '!node_modules/adblock-rs/js/example.mjs'
    - '!node_modules/adblock-rs/js/src/**'
    - '!node_modules/adblock-rs/js/test/**'
    - '!node_modules/@dictol/mdict-native/*.darwin-*.node'
    - '!node_modules/@dictol/accessibility-native/prebuilds/darwin-*/**'
    - '!node_modules/@dictol/screen-capture-native/prebuilds/darwin-*/**'
    - '!node_modules/@dictol/ocr-native/prebuilds/darwin-*/**'
    - '!node_modules/@dictol/mdict-native/*.win32-arm64*.node'
    - '!node_modules/@dictol/accessibility-native/prebuilds/win32-arm64/**'
    - '!node_modules/@dictol/screen-capture-native/prebuilds/win32-arm64/**'
    - '!node_modules/@dictol/ocr-native/prebuilds/win32-arm64/**'
    - '!node_modules/better-sqlite3/{deps,src}/**'
    - '!node_modules/better-sqlite3/prebuilds/darwin*.node'
    - '!node_modules/better-sqlite3/prebuilds/linux*.node'
    - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
    - '!node_modules/selection-hook/{build,docs,src}/**'
    - '!node_modules/selection-hook/prebuilds/darwin*/**'
    - '!node_modules/selection-hook/prebuilds/linux*/**'
    - '!node_modules/selection-hook/prebuilds/win32-arm64/**'
  target: ['nsis']
  signtoolOptions:
    certificateFile: build/codesign.pfx
    certificatePassword: '${env.WIN_CSC_PASSWORD}'
    # electron-builder's PKCS#12 reader cannot parse this legacy self-signed
    # certificate reliably; keep the publisher identity explicit while the
    # signing tool still receives the PFX and password below.
    publisherName: Toddalia
  # electron-builder's bundled legacy osslsigncode cannot read this PFX on the
  # current macOS host. The build orchestrator signs the finished PE files
  # with the locally installed osslsigncode instead.
  signExecutable: false
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.icns
  minimumSystemVersion: '14.0'
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  # The native files with architecture-specific names are present in both
  # universal staging apps; adblock-rs and system translation are lipo-merged.
  x64ArchFiles: '**/{app.asar.unpacked/{node_modules/@dictol/mdict-native/*.darwin-*.node,node_modules/@dictol/accessibility-native/prebuilds/darwin-x64/accessibility.node,node_modules/@dictol/screen-capture-native/prebuilds/darwin-x64/screen-capture.node,node_modules/@dictol/ocr-native/prebuilds/darwin-x64/ocr.node,node_modules/better-sqlite3/prebuilds/darwin-*.node,node_modules/selection-hook/prebuilds/darwin-*/selection-hook.node,resources/system-translation/dictol-system-translation,resources/sqlite-simple/darwin-*/libsimple.dylib},sqlite-simple/darwin-*/libsimple.dylib}'
  # Do not let electron-builder sign with a fallback identity. The afterPack
  # hook ad-hoc signs executable code on both macOS architectures; the app has
  # no Developer ID identity and is not notarized.
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  electronLanguages:
    - en
    - zh_CN
    - zh_TW
  files:
    # Keep the full base filter here. electron-builder treats a platform
    # filter made of ignores alone as a separate, implicit include-all set.
    - out/**
    - drizzle/**
    - resources/**
    - '!resources/ecdict/**'
    - '!**/.vscode/*'
    - '!src/*'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
    - '!Dictionaries/**'
    - '!dictionaries/**'
    - '!benchmarks/**'
    - '!docs/**'
    - '!native/**'
    - '!scripts/**'
    - '!node_modules/@dictol/mdict-native/{src,target,test,node_modules}/**'
    - '!node_modules/@dictol/mdict-native/{Cargo.lock,Cargo.toml,README.md,build.rs,index.d.ts,package-lock.json}'
    - '!node_modules/@dictol/accessibility-native/{macos,windows,target,test,node_modules}/**'
    - '!node_modules/@dictol/screen-capture-native/{macos,windows,target,test,node_modules}/**'
    - '!node_modules/@dictol/ocr-native/{macos,windows,target,test,node_modules}/**'
    - '!node_modules/adblock-rs/Cargo.lock'
    - '!node_modules/adblock-rs/Cargo.toml'
    - '!node_modules/adblock-rs/CHANGELOG.md'
    - '!node_modules/adblock-rs/README.md'
    - '!node_modules/adblock-rs/SECURITY.md'
    - '!node_modules/adblock-rs/benches/**'
    - '!node_modules/adblock-rs/fuzz/**'
    - '!node_modules/adblock-rs/src/**'
    - '!node_modules/adblock-rs/target/**'
    - '!node_modules/adblock-rs/rust-toolchain.toml'
    - '!node_modules/adblock-rs/rustfmt.toml'
    - '!node_modules/adblock-rs/js/artifacts.json'
    - '!node_modules/adblock-rs/js/Cargo.toml'
    - '!node_modules/adblock-rs/js/example.mjs'
    - '!node_modules/adblock-rs/js/src/**'
    - '!node_modules/adblock-rs/js/test/**'
    # The production main-process bundle contains the used Drizzle modules.
    - '!node_modules/drizzle-orm/**'
    # ExcelJS runs from lib/ in the main process; its browser distribution is
    # not used by Dictol.
    - '!node_modules/exceljs/dist/**'
    # Include both macOS native variants while staging; the afterPack hook
    # removes the opposite architecture and validates the packaged modules.
    - '!node_modules/@dictol/mdict-native/*.win32-*.node'
    - '!node_modules/@dictol/accessibility-native/prebuilds/win32-*/**'
    - '!node_modules/@dictol/screen-capture-native/prebuilds/win32-*/**'
    - '!node_modules/@dictol/ocr-native/prebuilds/win32-*/**'
    - node_modules/@dictol/mdict-native/*.darwin-*.node
    - node_modules/@dictol/accessibility-native/prebuilds/darwin-*/**
    - node_modules/@dictol/screen-capture-native/prebuilds/darwin-*/**
    - node_modules/@dictol/ocr-native/prebuilds/darwin-*/**
    - '!node_modules/better-sqlite3/{deps,src}/**'
    - '!node_modules/better-sqlite3/prebuilds/linux*.node'
    - '!node_modules/better-sqlite3/prebuilds/win32*.node'
    - node_modules/better-sqlite3/prebuilds/darwin-*.node
    - '!node_modules/selection-hook/{build,docs,src}/**'
    - '!node_modules/selection-hook/prebuilds/linux*/**'
    - '!node_modules/selection-hook/prebuilds/win32*/**'
    - node_modules/selection-hook/prebuilds/darwin-*/selection-hook.node
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  files:
    - out/**
    - '!out/main/chunks/mac-*.js'
    - drizzle/**
    - resources/**
    - '!resources/system-translation/**'
    - '!resources/ecdict/**'
    - '!resources/sqlite-simple/**'
    - '!native/**'
    - '!scripts/**'
    - '!node_modules/@dictol/mdict-native/{src,target,test,node_modules}/**'
    - '!node_modules/@dictol/mdict-native/{Cargo.lock,Cargo.toml,README.md,build.rs,index.d.ts,package-lock.json}'
    - '!node_modules/@dictol/mdict-native/*.darwin-*.node'
    - '!node_modules/@dictol/mdict-native/*.win32-*.node'
    - '!node_modules/@dictol/accessibility-native/prebuilds/darwin-*/**'
    - '!node_modules/@dictol/accessibility-native/prebuilds/win32-*/**'
    - '!node_modules/@dictol/screen-capture-native/prebuilds/darwin-*/**'
    - '!node_modules/@dictol/screen-capture-native/prebuilds/win32-*/**'
    - '!node_modules/@dictol/ocr-native/prebuilds/darwin-*/**'
    - '!node_modules/@dictol/ocr-native/prebuilds/win32-*/**'
  icon: build/icon.png
  desktop:
    entry:
      MimeType: x-scheme-handler/dictol
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
afterPack: scripts/strip-macos-signatures.mjs
