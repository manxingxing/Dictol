[package]
name = "dictol-mdict-node"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dictol-mdict = { path = "../mdict" }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
