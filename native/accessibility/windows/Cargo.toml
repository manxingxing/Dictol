[package]
name = "dictol-accessibility-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
