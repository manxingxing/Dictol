[package]
name = "dictol-screen-capture-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
png = "0.18"
screencapturekit = { version = "11.0.0", features = ["macos_14_0", "macos_15_2"] }

[build-dependencies]
cc = "1"
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
